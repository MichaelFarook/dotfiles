# ===============================
# Alacritty configuration (TOML)
# ===============================

# ---------- Window ----------
[window]
padding = { x = 6, y = 6 }
dynamic_title = true

# ---------- Font ----------
[font]
size = 11

[font.normal]
family = "JetBrains Mono"

[font.bold]
family = "JetBrains Mono"
style = "Bold"

[font.italic]
family = "JetBrains Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrains Mono"
style = "Bold Italic"

# ---------- Clipboard ----------
# Copy selection automatically to system clipboard (X11)
[selection]
save_to_clipboard = true

# Explicit keybindings (optional but clear)
[keyboard]
bindings = [
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "V", mods = "Control|Shift", action = "Paste" }
]

# ---------- Colors (from your URxvt theme) ----------
[colors.primary]
background = "#141c21"
foreground = "#93a1a1"

[colors.cursor]
text = "#141c21"
cursor = "#afbfbf"

[colors.normal]
black   = "#263640"
red     = "#d12f2c"
green   = "#819400"
yellow  = "#b08500"
blue    = "#2587cc"
magenta = "#696ebf"
cyan    = "#289c93"
white   = "#bfbaac"

[colors.bright]
black   = "#4a697d"
red     = "#fa3935"
green   = "#a4bd00"
yellow  = "#d9a400"
blue    = "#2ca2f5"
magenta = "#8086e8"
cyan    = "#33c5ba"
white   = "#fdf6e3"

